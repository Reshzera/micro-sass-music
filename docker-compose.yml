services:
  postgres:
    image: postgres:17-alpine
    container_name: micro-sass-music-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-micro_sass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-micro_sass}
      POSTGRES_DB: ${POSTGRES_DB:-micro_sass_music}
    ports:
      # 5433 on the host so a Postgres already sitting on 5432 doesn't clash.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-micro_sass} -d ${POSTGRES_DB:-micro_sass_music}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
